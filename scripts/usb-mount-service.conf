# USB Mount Service configuration
# Canonical mount roots checked by the service (comma-separated)
USB_MOUNT_PATHS="/data/data/com.termux/files/home/Drives,/mnt/termux-drives"

# Persistent role mapping
USB_MOUNT_VAULT_UUID="16BA8F9DBA8F784F"
USB_MOUNT_VAULT_LABEL="Rushtu 4TB"
USB_MOUNT_SCRATCH_UUID="8097-A8C4"
USB_MOUNT_SCRATCH_LABEL="T exFAT 2TB"
USB_MOUNT_VAULT_MAIN_LABEL="Rushtu 4TB"
USB_MOUNT_SCRATCH_MAIN_LABEL="T exFAT 2TB"
USB_MOUNT_VAULT_FALLBACK_LABEL="VAULT_fallback"
USB_MOUNT_SCRATCH_FALLBACK_LABEL="SCRATCH_fallback"

# Optional legacy aliases (D/E) pointing at role mount targets
USB_MOUNT_COMPAT_ALIASES="false"

# State + telemetry paths consumed by the dashboard backend
USB_MOUNT_STATE_PATH="/data/data/com.termux/files/home/Drives/.state/drives.json"
USB_MOUNT_EVENTS_PATH="/data/data/com.termux/files/home/Drives/.state/drive-events.jsonl"

# Daemon loop interval
USB_MOUNT_INTERVAL_SEC="15"

# Optional override for log + pid files
USB_MOUNT_LOG_PATH="/data/data/com.termux/files/home/home-server/logs/usb-mount-service.log"
USB_MOUNT_PID_PATH="/data/data/com.termux/files/home/home-server/runtime/usb-mount-service.pid"
