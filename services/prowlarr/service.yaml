schemaVersion: 1
name: prowlarr
label: "Prowlarr"
type: service
group: arr
surface: arr
description: "Indexer manager for ARR services."
aliases: []
dependencies: [filesystem]
controlMode: optional
binary: bash
host: 127.0.0.1
port: 9696
route: "/prowlarr/"
powerProfile: prowlarr0
commands:
  start: start.sh
  stop: stop.sh
  status: status.sh
  health: health.sh
  discover: discover.sh
  config: config.sh
health:
  type: custom
restart:
  policy: on-failure
  maxRestarts: 3
  windowSeconds: 300
