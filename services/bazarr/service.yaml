schemaVersion: 1
name: bazarr
label: "Bazarr"
type: service
group: arr
surface: arr
description: "Subtitle automation service for imported media."
aliases: []
dependencies: [filesystem, sonarr, radarr]
controlMode: optional
binary: bash
host: 127.0.0.1
port: 6767
route: "/bazarr/"
powerProfile: bazarr0
commands:
  start: start.sh
  stop: stop.sh
  status: status.sh
  health: health.sh
  discover: discover.sh
  config: config.sh
health:
  type: custom
restart:
  policy: on-failure
  maxRestarts: 3
  windowSeconds: 300
